name: f1-veteran-pipeline

on:
  schedule:
    - cron: "15 2 * * *" # Daily refresh at 02:15 UTC
  workflow_dispatch:
    inputs:
      ingest_mode:
        description: "historical for full refresh, incremental for one race"
        required: true
        default: "historical"
        type: choice
        options:
          - historical
          - incremental
      year:
        description: "Required when ingest_mode=incremental"
        required: false
        type: string
      round:
        description: "Required when ingest_mode=incremental"
        required: false
        type: string

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve ingestion mode and inputs
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "INGEST_MODE=historical" >> "$GITHUB_ENV"
            echo "START_YEAR=2022" >> "$GITHUB_ENV"
          else
            echo "INGEST_MODE=${{ github.event.inputs.ingest_mode }}" >> "$GITHUB_ENV"
            if [[ "${{ github.event.inputs.ingest_mode }}" == "historical" ]]; then
              echo "START_YEAR=2022" >> "$GITHUB_ENV"
            else
              if [[ -z "${{ github.event.inputs.year }}" || -z "${{ github.event.inputs.round }}" ]]; then
                echo "For incremental mode, provide both year and round inputs."
                exit 1
              fi
              echo "YEAR=${{ github.event.inputs.year }}" >> "$GITHUB_ENV"
              echo "ROUND=${{ github.event.inputs.round }}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Ingest Results
        env:
          OUTPUT_CSV_PATH: data/raw/jolpica_results_master.csv
        run: python src/preprocessing/ingest_jolpica_results.py

      - name: Ingest Qualifying and Build Canonical
        env:
          RESULTS_MASTER_CSV_PATH: data/raw/jolpica_results_master.csv
          QUALIFYING_MASTER_CSV_PATH: data/raw/jolpica_qualifying_master.csv
          CANONICAL_OUTPUT_CSV_PATH: data/raw/f1_canonical_master.csv
        run: python src/preprocessing/ingest_jolpica_qualifying.py

      - name: Build Veteran Feature Matrix
        env:
          CANONICAL_INPUT_CSV_PATH: data/raw/f1_canonical_master.csv
          VETERAN_OUTPUT_CSV_PATH: data/processed/veteran_training_matrix.csv
        run: python src/preprocessing/build_veteran_features.py

      - name: Train Ranker and Generate SHAP Report
        env:
          VETERAN_MATRIX_INPUT_PATH: data/processed/veteran_training_matrix.csv
        run: python src/models/train_ranker.py

      - name: Upload Pipeline Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f1-veteran-artifacts
          path: |
            data/raw/jolpica_results_master.csv
            data/raw/jolpica_qualifying_master.csv
            data/raw/f1_canonical_master.csv
            data/processed/veteran_training_matrix.csv
            models/f1_xgb_ranker.pkl
            models/f1_lgb_ranker.pkl
            outputs/reports/xgb_shap_summary.png
            outputs/reports/lgb_shap_summary.png
