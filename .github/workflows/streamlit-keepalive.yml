name: streamlit-keepalive

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-app:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app health endpoint
        env:
          APP_BASE_URL: https://f1-veteran-ranker.streamlit.app
        run: |
          set -e
          curl --fail --silent --show-error "$APP_BASE_URL/_stcore/health"

      - name: Ping Streamlit app root endpoint
        env:
          APP_BASE_URL: https://f1-veteran-ranker.streamlit.app
        run: |
          set -e
          curl --fail --silent --show-error --location "$APP_BASE_URL/" > /dev/null