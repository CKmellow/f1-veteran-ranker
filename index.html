<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 Veteran Ranker</title>
  <style>
    :root {
      --bg: #08121f;
      --panel: #112035;
      --panel-2: #182a44;
      --text: #f6f8fb;
      --muted: #a8bacf;
      --accent: #ff5c39;
      --accent-2: #ffd166;
      --line: #2d4464;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 15% -15%, #1a3558 0%, transparent 60%),
        radial-gradient(900px 500px at 100% 0%, #3a1f2b 0%, transparent 60%),
        var(--bg);
      font-family: "Rajdhani", "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .hero {
      display: grid;
      gap: 14px;
      padding: 20px;
      background: linear-gradient(145deg, var(--panel), var(--panel-2));
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 18px 36px rgba(0,0,0,.24);
      animation: rise .5s ease both;
    }

    .title {
      margin: 0;
      font-size: clamp(1.5rem, 3.2vw, 2.4rem);
      letter-spacing: .03em;
      font-weight: 700;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      line-height: 1.4;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      border: 1px solid var(--line);
      background: rgba(8,18,31,.55);
      border-radius: 999px;
      padding: 6px 12px;
      color: var(--muted);
      font-size: .95rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 12px rgba(255,209,102,.7);
    }

    .controls {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: .9rem;
      color: var(--muted);
    }

    select, input, button {
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(8,18,31,.75);
      color: var(--text);
      padding: 10px 11px;
      font: inherit;
    }

    button {
      background: linear-gradient(135deg, #ff5c39, #ff7a55);
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, filter .2s ease;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.05); }

    .grid {
      margin-top: 16px;
      display: grid;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 58px 1fr 110px;
      gap: 10px;
      align-items: center;
      background: rgba(17,32,53,.72);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px;
      animation: rise .35s ease both;
    }

    .rank {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-2);
      text-align: center;
    }

    .meta {
      display: grid;
      gap: 2px;
    }

    .driver {
      font-weight: 700;
      letter-spacing: .02em;
    }

    .team {
      font-size: .9rem;
      color: var(--muted);
    }

    .score {
      text-align: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .empty {
      margin-top: 14px;
      color: var(--muted);
      font-size: .95rem;
    }

    @media (max-width: 760px) {
      .controls { grid-template-columns: 1fr; }
      .row { grid-template-columns: 48px 1fr; }
      .score { grid-column: 1 / -1; text-align: left; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1 class="title">F1 Veteran Ranker</h1>
      <p class="sub">Live race-order simulation for your veteran grid. This page calls the deployed API directly on the same domain.</p>
      <div class="status"><span class="dot"></span><span id="statusText">Checking API health...</span></div>

      <div class="controls">
        <div class="field">
          <label for="circuit">Circuit Profile</label>
          <select id="circuit">
            <option>Balanced/Technical</option>
            <option>Power/High-Speed</option>
            <option>High-Downforce</option>
            <option>Street Circuit</option>
          </select>
        </div>
        <div class="field">
          <label for="trackTemp">Track Temp (C)</label>
          <input id="trackTemp" type="number" value="25" min="-20" max="70" step="1" />
        </div>
        <div class="field">
          <label for="isWet">Wet Race</label>
          <select id="isWet">
            <option value="0" selected>No</option>
            <option value="1">Yes</option>
          </select>
        </div>
      </div>

      <button id="predictBtn" type="button">Run Live Prediction</button>
    </section>

    <section id="results" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty">No predictions yet.</p>
  </main>

  <script>
    const statusText = document.getElementById("statusText");
    const predictBtn = document.getElementById("predictBtn");
    const results = document.getElementById("results");
    const empty = document.getElementById("empty");

    async function checkHealth() {
      try {
        const res = await fetch("/api/health", { method: "GET" });
        const data = await res.json();
        if (data.status === "ok") {
          statusText.textContent = "API online";
          return;
        }
        statusText.textContent = "API reachable but model artifacts are not ready";
      } catch (_err) {
        statusText.textContent = "API unavailable";
      }
    }

    function renderRows(items) {
      results.innerHTML = "";
      for (const item of items) {
        const row = document.createElement("article");
        row.className = "row";
        row.innerHTML = `
          <div class="rank">P${item.predicted_position}</div>
          <div class="meta">
            <div class="driver">${item.driver_label}</div>
            <div class="team">${item.team}</div>
          </div>
          <div class="score">Score: ${Number(item.predicted_score).toFixed(4)}</div>
        `;
        results.appendChild(row);
      }
      empty.style.display = items.length ? "none" : "block";
    }

    async function runPredict() {
      predictBtn.disabled = true;
      predictBtn.textContent = "Running...";
      try {
        const payload = {
          circuit_label: document.getElementById("circuit").value,
          is_wet: Number(document.getElementById("isWet").value),
          track_temp: Number(document.getElementById("trackTemp").value),
          overrides: []
        };

        const res = await fetch("/api/predict/live", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok || !data.leaderboard) {
          const detail = data.error || "Prediction failed";
          statusText.textContent = detail;
          renderRows([]);
          return;
        }

        statusText.textContent = "Prediction complete";
        renderRows(data.leaderboard);
      } catch (err) {
        statusText.textContent = "Request failed";
        renderRows([]);
      } finally {
        predictBtn.disabled = false;
        predictBtn.textContent = "Run Live Prediction";
      }
    }

    predictBtn.addEventListener("click", runPredict);
    checkHealth();
  </script>
</body>
</html>
